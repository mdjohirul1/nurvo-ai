name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png emblem.png logo.png www/
      - run: npm install
      - run: npx cap add android
      - name: Set app icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            cp icon-192.png "$d/ic_launcher.png"
            cp icon-192.png "$d/ic_launcher_round.png"
            cp icon-192.png "$d/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NURVO-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
