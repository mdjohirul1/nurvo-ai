<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NURVO AI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NURVO AI">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000706;--pn:#0a1816;--ln:#173530;--ink:#e8f5f1;--mu:#7fa59d;--gold:#f0b44a;--em:#22e3a0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--ln);background:var(--pn)}
header img{width:32px;height:32px;border-radius:8px}
header b{font-size:18px;letter-spacing:.04em;flex:1;background:linear-gradient(90deg,var(--gold),var(--em));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:none;border:1px solid var(--ln);border-radius:10px;width:40px;height:40px;font-size:18px}
.tabs{display:flex;gap:6px;padding:8px 12px;background:var(--pn)}
.tabs button{flex:1;padding:7px;border-radius:10px;border:1px solid var(--ln);background:none;font-size:15px;color:var(--mu)}
.tabs .on{background:var(--em);color:#021;border-color:var(--em);font-weight:700}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(720px,92%);padding:10px 14px;border-radius:16px;line-height:1.65;font-size:16px;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--gold);color:#1d1300;border-bottom-right-radius:4px;white-space:pre-wrap}
.ai{align-self:flex-start;background:var(--pn);border:1px solid var(--ln);border-bottom-left-radius:4px}
.ai p{margin:0 0 8px}.ai p:last-of-type{margin:0}
.msg img.g{max-width:100%;border-radius:10px;display:block;margin:4px 0}
.ai code.i{background:#12302b;padding:1px 6px;border-radius:6px;font-size:.92em}
.cb{margin:8px 0;border-radius:10px;overflow:hidden;background:#020d0b;border:1px solid var(--ln)}
.cb .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:12px;color:var(--mu)}
.cb pre{margin:0;padding:10px 12px;overflow-x:auto;color:#cdeee4;font-size:13.5px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace}
.sm{background:none;border:1px solid var(--ln);border-radius:8px;font-size:12px;padding:2px 9px;color:var(--mu)}
.act{display:flex;gap:6px;margin-top:8px}
.wel{margin:auto;text-align:center;max-width:380px}
.wel img{width:min(260px,70%)}
.wel div{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wel button{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px;font-size:15px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--em);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
footer{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));background:var(--pn);border-top:1px solid var(--ln)}
#pv{display:none;max-width:780px;margin:0 auto 6px}#pv img{height:54px;border-radius:8px;vertical-align:middle}
.row{display:flex;gap:6px;align-items:flex-end;max-width:780px;margin:0 auto}
textarea{flex:1;resize:none;max-height:130px;font:inherit;font-size:16px;padding:10px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);line-height:1.5}
.send{background:linear-gradient(135deg,var(--gold),var(--em));color:#021;border:0;border-radius:14px;padding:0 16px;height:44px;font-weight:700;font-size:15px}
.send:disabled{opacity:.5}
.rec{background:#c0392b!important}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--em);outline-offset:1px}
#dr{position:fixed;inset:0;display:none;z-index:5;background:#0009}
#dr.o{display:block}
#dr aside{width:min(300px,84%);height:100%;background:var(--pn);border-right:1px solid var(--ln);padding:calc(12px + env(safe-area-inset-top,0)) 12px 12px;display:flex;flex-direction:column;gap:8px}
#cl{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;gap:4px}.ci button:first-child{flex:1;text-align:left;background:none;border:1px solid var(--ln);border-radius:10px;padding:9px;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ci .cu{border-color:var(--em)}
.pb{background:none;border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:15px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--pn);color:var(--ink);padding:18px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
dialog label{display:block;font-weight:600;margin:12px 0 4px}
dialog input{width:100%;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
dialog small{color:var(--mu);display:block;margin-top:4px;line-height:1.5}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
a{color:var(--em)}
</style></head><body>
